version: '3.8'

services:
  kumesha-api:
    build:
      context: .
      dockerfile: Dockerfile.kumesha
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./Kumesha:/app/Kumesha

    restart: unless-stopped

  minuk-api:
    build:
      context: .
      dockerfile: Dockerfile.minuk
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./minuk:/app/minuk

    restart: unless-stopped

  voshan-api:
    build:
      context: .
      dockerfile: Dockerfile.voshan
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - ./Voshan:/app/Voshan
    restart: unless-stopped
