services:
  kumesha-api:
    build:
      context: .
      dockerfile: Dockerfile.kumesha
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  minuk-api:
    build:
      context: .
      dockerfile: Dockerfile.minuk
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped

  voshan-api:
    build:
      context: .
      dockerfile: Dockerfile.voshan
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env
    restart: unless-stopped
